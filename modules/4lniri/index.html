<section class="modulex-gs3{{gs3tek}}" id="gs3-{{id}}" data-gs3-sayac="{{counter}}">
  <div class="modulex-gs3-wrap">
    {{gs3head}}
    {{gs3empty}}
    <div class="modulex-gs3-sahne" role="region" aria-roledescription="carousel" aria-label="{{regionLabel}}" tabindex="0">
      <div class="modulex-gs3-slides">{{gs3slides}}</div>
      <button type="button" class="modulex-gs3-nav modulex-gs3-onceki" data-gs3-onceki aria-label="{{prevLabel}}" hidden><span class="material-symbols-outlined" aria-hidden="true">chevron_left</span></button>
      <button type="button" class="modulex-gs3-nav modulex-gs3-sonraki" data-gs3-sonraki aria-label="{{nextLabel}}" hidden><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></button>
    </div>
    <p class="modulex-gs3-say" aria-live="polite" data-gs3-say>{{gs3sayac}}</p>
    <ul class="modulex-gs3-thumbs" aria-label="{{thumbsLabel}}">{{gs3thumbs}}</ul>
  </div>
</section>

<style>
  /* Galeri — sahne + küçük resim şeridi (galeri-masonry-3). */
  .modulex-gs3 {
    box-sizing: border-box; width: 100%;
    padding-block: clamp(36px, 6vw, 80px); padding-inline: clamp(16px, 4vw, 32px);
    background: --bgcolor--; color: --textcolor--;
  }
  .modulex-gs3 *, .modulex-gs3 *::before, .modulex-gs3 *::after { box-sizing: border-box; }
  .modulex-gs3 :where(span:not(.material-symbols-outlined), bdi, b, strong, em) { font: inherit; }
  .modulex-gs3-wrap { max-width: --max--; margin-inline: auto; }
  .modulex-gs3-head { margin-block-end: 24px; text-align: center; }
  .modulex-gs3-title { margin: 0 0 8px; font-size: clamp(1.6rem, 1.2rem + 1.5vw, 2.4rem); line-height: 1.2; color: --textcolor--; }
  .modulex-gs3-desc { margin: 0 auto; max-width: 60ch; line-height: 1.7; color: --mutedcolor--; }
  .modulex-gs3-bos { margin: 0; text-align: center; color: --mutedcolor--; }

  .modulex-gs3-sahne { position: relative; border-radius: --radius--; overflow: hidden; background: --surface2--; }
  .modulex-gs3-sahne:focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-gs3-slide { margin: 0; }
  .modulex-gs3-slide[hidden] { display: none; }
  .modulex-gs3-img, .modulex-gs3-ph { display: block; width: 100%; height: auto; aspect-ratio: --ratio--; object-fit: cover; }
  .modulex-gs3-ph { display: flex; align-items: center; justify-content: center; color: --mutedcolor--; }
  .modulex-gs3-ph .material-symbols-outlined { font-size: 56px; }
  .modulex-gs3-cap { padding: 12px 16px; font-weight: 600; background: --surface--; color: --textcolor--; }
  .modulex-gs3-nav {
    position: absolute; top: 50%; transform: translateY(-50%); display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: 50%; border: 1px solid --bordercolor--; background: --bgcolor--; color: --textcolor--;
    cursor: pointer; box-shadow: 0 4px 14px color-mix(in srgb, --textcolor-- 20%, transparent);
  }
  .modulex-gs3-nav:hover { background: --accent--; color: --accentText--; }
  .modulex-gs3-nav:focus-visible { outline: 3px solid --accent--; outline-offset: 2px; }
  .modulex-gs3-onceki { inset-inline-start: 12px; }
  .modulex-gs3-sonraki { inset-inline-end: 12px; }
  [dir="rtl"] .modulex-gs3-nav .material-symbols-outlined { transform: scaleX(-1); }
  .modulex-gs3-say { margin: 10px 0; min-height: 1.4em; text-align: center; font-size: 0.9rem; color: --mutedcolor--; font-variant-numeric: tabular-nums; }

  .modulex-gs3-thumbs {
    list-style: none; margin: 0; padding: 4px 2px 8px; display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity;
  }
  .modulex-gs3-tek .modulex-gs3-thumbs, .modulex-gs3-tek .modulex-gs3-say { display: none; }
  .modulex-gs3-thumbs li { flex: 0 0 auto; scroll-snap-align: start; }
  .modulex-gs3-thumb {
    display: flex; align-items: center; justify-content: center; width: 112px; height: 70px; padding: 0; overflow: hidden;
    border-radius: 8px; border: 2px solid transparent; background: --surface2--; color: --mutedcolor--; cursor: pointer; opacity: 0.7;
    transition: opacity 0.2s ease, border-color 0.2s ease;
  }
  .modulex-gs3-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .modulex-gs3-thumb:hover { opacity: 1; }
  .modulex-gs3-thumb[aria-current="true"] { opacity: 1; border-color: --accent--; }
  .modulex-gs3-thumb:focus-visible { outline: 3px solid --accent--; outline-offset: 2px; opacity: 1; }

  @media (max-width: 640px) {
    .modulex-gs3-nav { width: 40px; height: 40px; }
    .modulex-gs3-thumb { width: 84px; height: 56px; }
    [class*="modulex"] { max-width: 100%; box-sizing: border-box; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-gs3 *, .modulex-gs3 *::before, .modulex-gs3 *::after { animation: none !important; transition: none !important; }
  }
</style>

<script>
  /* Sahne geçişi: küçük resim / önceki-sonraki / ←→ (RTL'de ters). Otomatik oynatma yok. */
  (function () {
    var kok = document.getElementById("gs3-{{id}}");
    if (!kok || kok.getAttribute("data-gs3-hazir") === "1") { return; }
    kok.setAttribute("data-gs3-hazir", "1");
    var slaytlar = kok.querySelectorAll("[data-gs3-i]");
    var kucukler = kok.querySelectorAll("[data-gs3-git]");
    var say = kok.querySelector("[data-gs3-say]");
    var sablon = kok.getAttribute("data-gs3-sayac") || "{i} / {n}";
    var n = slaytlar.length;
    if (n < 2) { return; }
    var aktif = 0;
    function git(i) {
      aktif = (i + n) % n;
      var j;
      for (j = 0; j < n; j++) { slaytlar[j].hidden = j !== aktif; }
      for (j = 0; j < kucukler.length; j++) {
        if (j === aktif) { kucukler[j].setAttribute("aria-current", "true"); } else { kucukler[j].removeAttribute("aria-current"); }
      }
      if (kucukler[aktif] && kucukler[aktif].scrollIntoView) {
        try { kucukler[aktif].scrollIntoView({ block: "nearest", inline: "nearest" }); } catch (e) { /* eski tarayıcı */ }
      }
      if (say) { say.textContent = sablon.replace("{i}", aktif + 1).replace("{n}", n); }
    }
    var onceki = kok.querySelector("[data-gs3-onceki]");
    var sonraki = kok.querySelector("[data-gs3-sonraki]");
    onceki.hidden = false;
    sonraki.hidden = false;
    onceki.addEventListener("click", function () { git(aktif - 1); });
    sonraki.addEventListener("click", function () { git(aktif + 1); });
    var i;
    for (i = 0; i < kucukler.length; i++) {
      kucukler[i].addEventListener("click", function (e) {
        e.preventDefault();
        git(parseInt(this.getAttribute("data-gs3-git"), 10) || 0);
      });
    }
    kok.querySelector(".modulex-gs3-sahne").addEventListener("keydown", function (e) {
      var rtl = document.documentElement.dir === "rtl";
      if (e.key === "ArrowRight") { e.preventDefault(); git(aktif + (rtl ? -1 : 1)); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); git(aktif + (rtl ? 1 : -1)); }
    });
  })();
</script>
